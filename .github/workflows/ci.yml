name: CI

# Runs automatically on every commit pushed to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt

      - name: Unit and integration tests with line + branch coverage
        run: >
          python -m pytest tests
          --cov=compressor --cov-branch
          --cov-report=term-missing --cov-report=xml
          --junitxml=unit-test-results.xml

      - name: System validation tests (run the real command line program)
        run: python -m pytest system_tests -v --junitxml=system-test-results.xml

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            unit-test-results.xml
            system-test-results.xml
            coverage.xml